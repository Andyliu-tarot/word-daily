<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單字闖關拼字王</title>
<style>
:root{--bg:#14213d;--card:#1f3157;--ac:#fca311;--ok:#2ecc71;--bad:#ff5a5f;--tx:#f5f7ff;--mu:#9fb0d6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;overflow:hidden}
#app{height:100dvh;max-width:480px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;min-height:0}.scr.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
h1{text-align:center;margin:18px 0 4px;font-size:28px}
.sub{text-align:center;color:var(--mu);margin:0 0 18px;font-size:14px}
.lv{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;border:2px solid transparent}
.lv:active{border-color:var(--ac);transform:scale(.98)}
.lv b{font-size:18px}.lv small{display:block;color:var(--mu);margin-top:4px;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:8px}
.top .sc{font-weight:700;color:var(--ac)}
.bar{height:8px;background:var(--card);border-radius:4px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.prog{font-size:13px;color:var(--mu);display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:16px;padding:14px;margin:8px 0;text-align:center}
.mean{font-size:28px;font-weight:800}.pos{color:var(--ac);font-size:15px;margin-left:6px}
.ex{color:var(--mu);margin-top:8px;font-size:15px;line-height:1.4;min-height:21px}
.spk{margin-top:8px;background:#2c4577;border-radius:20px;padding:6px 16px;font-size:14px}
#msg{min-height:22px;text-align:center;font-weight:700;font-size:15px}
#slots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:8px 0}
.sl{flex:0 1 44px;min-width:24px;aspect-ratio:1/1.15;border-radius:8px;background:#0e1830;border:2px dashed #4a6199;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,5vw,24px);font-weight:800}
.sl.f{border:2px solid var(--ac);background:#27406f}.sl.lk{border-color:#7a8bb5;background:#33436b}
.sl.g{background:var(--ok);border-color:var(--ok);color:#06210f}.sl.r{border-color:var(--bad);background:#5b2230}
#slots.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#pool{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:8px;min-height:0;padding:6px 0}
.tl{width:48px;height:52px;border-radius:12px;background:var(--ac);color:#1b1b1b;font-size:22px;font-weight:800;box-shadow:0 3px 0 #b87408}
.tl:active{transform:translateY(2px);box-shadow:0 1px 0 #b87408}.tl.u{visibility:hidden}
.acts{display:flex;gap:10px;margin:6px 0 10px}
.acts button{flex:1;padding:13px 0;border-radius:14px;background:#2c4577;font-size:16px}
.acts button:active{background:#3b5a96}
.res{margin:auto;text-align:center}.res .big{font-size:64px}.res p{font-size:18px;line-height:1.7}
.pri{background:var(--ac);color:#1b1b1b;font-weight:800;border-radius:14px;padding:14px 28px;font-size:18px;margin:6px;}
.ghost{background:#2c4577;border-radius:14px;padding:14px 28px;font-size:18px;margin:6px}
#popts{display:flex;flex-direction:column;gap:12px;margin-top:auto;margin-bottom:16px}
.opt{padding:18px;border-radius:14px;background:#2c4577;font-size:20px;font-weight:700}
.opt:active{background:#3b5a96}.opt.g{background:var(--ok);color:#06210f}.opt.r{background:var(--bad)}
</style>
</head>
<body>
<div id="app">
 <section class="scr on" id="home">
  <h1>🔤 單字闖關拼字王</h1>
  <p class="sub">佳音翰林版 · 點字母拼出單字</p>
  <div id="stats" style="text-align:center;color:var(--mu);font-size:13px;margin:-8px 0 14px"></div>
  <button class="lv" data-lv="1"><b>🌴 Lv1 初級島（B1–B2）</b><small>佳音翰林 B1–B2 單字 · 首字母提示 · 無計時<br>通關：答對 5 題</small></button>
  <button class="lv" data-lv="2"><b>🏝️ Lv2 中級島（B3–B4）</b><small>佳音翰林 B3–B4 單字 · 2 個干擾字母<br>30 秒 · 3 顆愛心 · 通關：答對 8 題</small></button>
  <button class="lv" data-lv="3"><b>🌋 Lv3 高級島（B5–B6）</b><small>佳音翰林 B5–B6 單字 · 4 個高混淆字母<br>20 秒 · 2 顆愛心 · Combo 加分 · 通關：答對 10 題</small></button>
  <button class="lv" id="pbtn"><b>📘 片語挑戰（選擇題）</b><small>全冊片語與多字詞組，從 4 個選項選出正確英文<br>3 顆愛心 · 連續答對加分 · 通關：答對 8 題</small></button>
 </section>
 <section class="scr" id="game">
  <div class="top"><button id="quit" class="spk" style="margin:0">✕</button><span id="hearts"></span><span id="combo"></span><span class="sc" id="score">0</span></div>
  <div class="bar" id="tbar"><i id="tfill"></i></div>
  <div class="prog"><span id="prog"></span><span id="time"></span></div>
  <div class="card">
   <div><span class="mean" id="mean"></span><span class="pos" id="pos"></span></div>
   <div class="ex" id="ex"></div>
   <button class="spk" id="spk">🔊 發音</button>
  </div>
  <div id="msg"></div>
  <div id="slots"></div>
  <div id="pool"></div>
  <div class="acts"><button id="del">刪除 ⌫</button><button id="rst">重填 ↺</button><button id="hint">提示 💡</button></div>
 </section>
 <section class="scr" id="phr">
  <div class="top"><button id="pq" class="spk" style="margin:0">✕</button><span id="ph"></span><span id="pc"></span><span class="sc" id="ps">0 分</span></div>
  <div class="prog" style="margin-top:10px"><span id="pp"></span></div>
  <div class="card" style="margin-top:12px"><div class="mean" id="pm"></div><div class="ex" id="pe"></div></div>
  <div id="pmsg" style="min-height:22px;text-align:center;font-weight:700"></div>
  <div id="popts"></div>
 </section>
 <section class="scr" id="end">
  <div class="res"><div class="big" id="eIcon"></div><h2 id="eTitle"></h2><p id="eText"></p>
   <button class="pri" id="again">再玩一次</button><button class="ghost" id="menu">回選單</button></div>
 </section>
</div>

function dist(w,n){const c=shuf([...new Set(w.split('').flatMap(x=>(CONF[x]||'').split('')))]);const o=[];for(const x of c){if(o.length>=n)break;o.push(x)}
 const al='ABCDEFGHIJKLMNOPQRSTUVWXYZ';while(o.length<n)o.push(al[Math.random()*26|0]);return o}
const CFG={1:{n:5,t:0,h:0,d:0},2:{n:8,t:30,h:3,d:2},3:{n:10,t:20,h:2,d:4}};
const $=id=>document.getElementById(id);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S,cur,tiles,slots,locked,lock,timer,tLeft,hinted,hints;
// 音效 / 震動 / 發音
let AC;
function tone(f,d,type='sine',at=0,v=.15){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const sClick=()=>{tone(620,.06,'square',0,.06);vib(10)};
const sOk=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.1));vib([30,40,60])};
const sBad=()=>{tone(200,.25,'sawtooth',0,.12);tone(150,.3,'sawtooth',.15,.12);vib([80,40,80])};
function speak(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.toLowerCase());u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));if(id==='home')stats()}
// 學習記憶（間隔重複）
let stat={};try{stat=JSON.parse(localStorage.getItem('wq')||'{}')}catch(e){}
function upd(k,r){const b=stat[k];stat[k]=r>0?Math.min(5,(b||0)+1):r===0?Math.min(b||0,1):0;try{localStorage.setItem('wq',JSON.stringify(stat))}catch(e){}}
function miss(w,m){if(!S.miss.some(x=>x[0]===w))S.miss.push([w,m])}
function rq(x){if(!x.rq){x.rq=1;S.q.splice(Math.min(S.i+2,S.q.length),0,x)}}
function prio(a,key){const sc=k=>{const b=stat[k];return b===undefined?1:[3,2.5,1.5,1,.5,.2][b]};return a.map(x=>[sc(key(x))*(.5+Math.random()),x]).sort((p,q)=>q[0]-p[0]).map(p=>p[1])}
function stats(){const c=[0,0,0,0],t=[0,0,0,0];RAW.forEach(x=>{t[x.lv-1]++;if(stat[x.word]>=4)c[x.lv-1]++});PH.forEach(x=>{t[3]++;if(stat['p:'+x.p]>=4)c[3]++});$('stats').innerHTML='📊 已熟練（不靠提示連續答對 4 次）<br>Lv1 '+c[0]+'/'+t[0]+' · Lv2 '+c[1]+'/'+t[1]+' · Lv3 '+c[2]+'/'+t[2]+' · 片語 '+c[3]+'/'+t[3]}
function preview(cb){
 lock=true;const tok=S;
 const s0=slots.slice(),l0=locked.slice(),u0=tiles.map(t=>t.u);
 tiles.forEach(t=>t.u=false);const L=cur.word.split('');
 slots=L.map(c=>{const k=tiles.findIndex(t=>!t.u&&t.c===c);tiles[k].u=true;return k});
 locked=L.map(()=>true);render('g');
 $('msg').style.color='var(--ac)';$('msg').textContent='👀 新單字！看一眼，跟著唸';speak(cur.word);
 setTimeout(()=>{if(S!==tok)return;slots=s0;locked=l0;tiles.forEach((t,i)=>t.u=u0[i]);lock=false;$('msg').textContent='';render();cb()},3200);
}
// 流程
function start(lv){
 const c=CFG[lv];
 S={lv,c,q:prio(RAW.filter(w=>w.lv===lv),w=>w.word),i:0,ok:0,score:0,hearts:c.h,combo:0,miss:[]};RAW.forEach(x=>x.rq=0);
 $('tbar').style.display=$('time').style.display=c.t?'':'none';
 show('game');next();
}
function next(){
 clearInterval(timer);
 if(S.ok>=S.c.n||S.i>=S.q.length)return end(S.ok>=S.c.n);
 cur=S.q[S.i++];lock=false;hinted=false;hints=3;
 const L=cur.word.split(''),ex=S.c.d?dist(cur.word,S.c.d):[];
 tiles=shuf([...L,...ex]).map(c=>({c,u:false}));
 slots=Array(L.length).fill(-1);locked=Array(L.length).fill(false);
 if(S.lv===1){const k=tiles.findIndex(t=>t.c===L[0]);slots[0]=k;locked[0]=true;tiles[k].u=true}
 $('mean').textContent=cur.mean;$('pos').textContent=cur.pos;
 $('ex').textContent=cur.ex||(cur.word.length+' 個字母');
 $('msg').textContent='';
 render();hud();
 if(stat[cur.word]===undefined)preview(go);else go();
}
function go(){
 if(S.c.t){tLeft=S.c.t;const t0=Date.now();timer=setInterval(()=>{tLeft=S.c.t-(Date.now()-t0)/1000;if(tLeft<=0){tLeft=0;clearInterval(timer);timeout()}tick()},100);tick()}
}
function tick(){const p=tLeft/S.c.t*100;const f=$('tfill');f.style.width=p+'%';f.style.background=p>50?'var(--ok)':p>25?'var(--ac)':'var(--bad)';$('time').textContent='⏱ '+Math.ceil(tLeft)+' 秒'}
function hud(){
 $('score').textContent=S.score+' 分';
 $('hint').textContent='提示 💡 ('+hints+')';
 $('prog').textContent='Lv'+S.lv+' · 已答對 '+S.ok+' / '+S.c.n;
 $('hearts').textContent=S.c.h?'❤️'.repeat(S.hearts)+'🖤'.repeat(S.c.h-S.hearts):'';
 $('combo').textContent=S.lv===3&&S.combo>1?'🔥×'+mult().toFixed(1):'';
}
const mult=()=>Math.min(1+(S.combo-1)*.5,3);
function render(st){
 $('slots').innerHTML=slots.map((k,i)=>'<div class="sl'+(k>=0?' f':'')+(locked[i]?' lk':'')+(st?' '+st:'')+'" data-s="'+i+'">'+(k>=0?tiles[k].c:'')+'</div>').join('');
 $('pool').innerHTML=tiles.map((t,i)=>'<button class="tl'+(t.u?' u':'')+'" data-t="'+i+'">'+t.c+'</button>').join('');
}
function put(k){
 const s=slots.findIndex((v,i)=>v<0&&!locked[i]);
 if(s<0||tiles[k].u||lock)return;
 slots[s]=k;tiles[k].u=true;sClick();render();
 if(slots.every(v=>v>=0))check();
}
function back(s){
 if(lock||locked[s]||slots[s]<0)return;
 tiles[slots[s]].u=false;slots[s]=-1;sClick();render();
}
function clearAll(){slots.forEach((k,i)=>{if(k>=0&&!locked[i]){tiles[k].u=false;slots[i]=-1}})}
function check(){
 const g=slots.map(k=>tiles[k].c).join('');
 if(g===cur.word)win();else wrong();
}
function win(){
 lock=true;clearInterval(timer);sOk();
 S.ok++;S.combo=hinted?0:S.combo+1;upd(cur.word,hinted?0:1);
 let pts=cur.word.length*2+(S.c.t?Math.round(tLeft/2):5)-(hinted?5:0);
 pts=Math.max(5,pts);if(S.lv===3)pts=Math.round(pts*mult());
 S.score+=pts;
 render('g');$('msg').style.color='var(--ok)';$('msg').textContent='✅ 答對了！+'+pts+' 分';
 hud();speak(cur.word);
 setTimeout(next,1700);
}
function reveal(){
 clearInterval(timer);
 tiles.forEach(t=>t.u=false);
 const L=cur.word.split('');
 slots=L.map(c=>{const k=tiles.findIndex(t=>!t.u&&t.c===c);tiles[k].u=true;return k});
 locked=L.map(()=>true);
 render('g');
 $('msg').style.color='var(--bad)';$('msg').textContent='💡 提示用完了，正確答案：'+cur.word;
 if(S.c.h)S.hearts--;
 hud();speak(cur.word);
 setTimeout(()=>S.c.h&&S.hearts<=0?end(false):next(),5000);
}
function wrong(){
 lock=true;sBad();S.combo=0;upd(cur.word,-1);miss(cur.word,cur.mean);rq(cur);
 if(hints<=0)return reveal();
 const sh=$('slots');render('r');sh.classList.add('shake');
 $('msg').style.color='var(--bad)';$('msg').textContent='❌ 再試試看';
 if(S.c.h){S.hearts--;hud();if(S.hearts<=0){clearInterval(timer);return setTimeout(()=>end(false),900)}}
 hud();
 setTimeout(()=>{sh.classList.remove('shake');clearAll();lock=false;$('msg').textContent='';render()},550);
}
function timeout(){
 lock=true;sBad();S.combo=0;S.hearts--;upd(cur.word,-1);miss(cur.word,cur.mean);rq(cur);hud();
 $('msg').style.color='var(--bad)';$('msg').textContent='⏰ 時間到！答案：'+cur.word;
 speak(cur.word);
 setTimeout(()=>S.hearts<=0?end(false):next(),1800);
}
function hint(){
 if(lock||hints<=0)return;
 for(let i=0;i<slots.length;i++){
  const need=cur.word[i];
  if(slots[i]>=0&&tiles[slots[i]].c===need){continue}
  if(slots[i]>=0){tiles[slots[i]].u=false;slots[i]=-1}
  const k=tiles.findIndex(t=>!t.u&&t.c===need);
  if(k<0){clearAll();continue}
  slots[i]=k;tiles[k].u=true;locked[i]=true;hinted=true;hints--;hud();sClick();render();
  if(slots.every(v=>v>=0))check();
  return;
 }
}
function end(ok){
 clearInterval(timer);
 $('eIcon').textContent=ok?'🏆':'💔';
 $('eTitle').textContent=ok?'闖關成功！':'挑戰失敗';
 $('eText').innerHTML='答對 '+S.ok+' / '+S.c.n+' 題<br>總分：<b style="color:var(--ac)">'+S.score+'</b>'+(S.miss.length?'<div style="text-align:left;font-size:15px;line-height:1.6;margin:8px 0">📝 這回要加強（會更常出現）：<br>'+S.miss.slice(0,8).map(x=>x[0]+' '+x[1]).join('<br>')+'</div>':'');
 show('end');
}
// 片語選擇題
const PH=PD.map(a=>({p:a[0],pos:a[1],m:a[2],e:EXM[a[0].toLowerCase()]||''}));
let P,PO;
function startP(){S={lv:'p',c:{n:8},q:prio(PH,x=>'p:'+x.p),i:0,ok:0,score:0,hearts:3,combo:0,miss:[]};PH.forEach(x=>x.rq=0);show('phr');nextP()}
function hudP(){$('ph').textContent='\u2764\ufe0f'.repeat(S.hearts)+'\ud83d\udda4'.repeat(3-S.hearts);$('pc').textContent=S.combo>1?'\ud83d\udd25\u00d7'+S.combo:'';$('ps').textContent=S.score+' \u5206';$('pp').textContent='\u55ae\u5b57\u7247\u8a9e \u00b7 \u5df2\u7b54\u5c0d '+S.ok+' / '+S.c.n}
function nextP(){
 if(S.ok>=S.c.n||S.i>=S.q.length)return end(S.ok>=S.c.n);
 P=S.q[S.i++];lock=false;
 const same=shuf(PH.filter(x=>x!==P&&x.pos&&x.pos===P.pos)),oth=shuf(PH.filter(x=>x!==P&&x.pos!==P.pos));
 PO=shuf([P,...[...same,...oth].slice(0,3)]);
 $('pm').textContent=P.m;$('pe').textContent=P.e||(P.pos||'\u9078\u51fa\u6b63\u78ba\u7684\u82f1\u6587');$('pmsg').textContent='';
 $('popts').innerHTML=PO.map((x,i)=>'<button class="opt" data-i="'+i+'">'+x.p.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</button>').join('');
 hudP();
}
function pick(b){
 if(lock)return;lock=true;
 const ok=PO[+b.dataset.i]===P,m=$('pmsg');
 document.querySelectorAll('.opt').forEach(x=>{if(PO[+x.dataset.i]===P)x.classList.add('g')});
 if(P.e)$('pe').textContent=P.e.replace('___',P.p);
 if(ok){sOk();upd('p:'+P.p,1);S.ok++;S.combo++;const pts=10+Math.min(S.combo-1,5)*2;S.score+=pts;m.style.color='var(--ok)';m.textContent='\u2705 \u7b54\u5c0d\u4e86\uff01+'+pts+' \u5206'}
 else{b.classList.add('r');sBad();upd('p:'+P.p,-1);miss(P.p,P.m);rq(P);S.combo=0;S.hearts--;m.style.color='var(--bad)';m.textContent='\u274c \u6b63\u78ba\u7b54\u6848\uff1a'+P.p}
 speak(P.p);hudP();
 setTimeout(()=>S.hearts<=0?end(false):nextP(),1600);
}
$('pbtn').onclick=()=>{sClick();startP()};
$('popts').onclick=e=>{const b=e.target.closest('.opt');if(b)pick(b)};
$('pq').onclick=()=>show('home');
// 事件
document.querySelectorAll('.lv[data-lv]').forEach(b=>b.onclick=()=>{sClick();start(+b.dataset.lv)});
$('pool').onclick=e=>{const b=e.target.closest('[data-t]');if(b)put(+b.dataset.t)};
$('slots').onclick=e=>{const b=e.target.closest('[data-s]');if(b)back(+b.dataset.s)};
$('del').onclick=()=>{if(lock)return;for(let i=slots.length-1;i>=0;i--)if(slots[i]>=0&&!locked[i]){back(i);break}};
$('rst').onclick=()=>{if(lock)return;sClick();clearAll();render()};
$('hint').onclick=hint;
$('spk').onclick=()=>cur&&speak(cur.word);
$('quit').onclick=()=>{clearInterval(timer);show('home')};
$('again').onclick=()=>S.lv==='p'?startP():start(S.lv);
$('menu').onclick=()=>show('home');
stats();
</script>
</body>
</html>
